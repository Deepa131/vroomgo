name: CI

# Runs on every push/PR so vulnerability fixes and security improvements in
# commit history are backed by an automated check, not just manual review.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend - install, lint-check, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every source file
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Verify the app loads without runtime errors
        run: node -e "process.env.MONGODB_URI='mongodb://localhost:27017/ci_placeholder'; require('./src/app'); console.log('app loaded OK');"

      # Automated security check: fails the build on known HIGH/CRITICAL
      # vulnerabilities in dependencies (supply-chain risk).
      - name: npm audit (fail on high/critical vulnerabilities)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend - install, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      # Automated security check: fails the build on known HIGH/CRITICAL
      # vulnerabilities in dependencies (supply-chain risk).
      - name: npm audit (fail on high/critical vulnerabilities)
        run: npm audit --audit-level=high

  # Static Application Security Testing (SAST): scans both JavaScript
  # codebases for common vulnerability patterns (injection, insecure
  # crypto usage, etc) on every push, independent of manual code review.
  codeql:
    name: CodeQL SAST scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
